# Reusable job: sign the image (cosign keyless) and self-verify the signature.
#
# IMPORTANT (keyless identity): cosign runs INSIDE this reusable workflow, so
# the Fulcio certificate SAN is this file's path. The self-verify below and the
# cluster-side consumer must expect:
#   .../.github/workflows/job-sign-verify.yml@refs/heads/main
name: job-sign-verify

on:
  workflow_call:
    inputs:
      registry:
        description: Container registry host (e.g. ghcr.io)
        required: true
        type: string
      image_repo:
        description: Fully-qualified image repository
        required: true
        type: string
      image_digest:
        description: Digest of the image to sign
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  sign-verify:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ inputs.registry }}
      IMAGE_REPO: ${{ inputs.image_repo }}
      IMAGE_DIGEST: ${{ inputs.image_digest }}
    steps:
      - name: Harden the runner (StepSecurity)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign image with Cosign keyless
        env:
          COSIGN_EXPERIMENTAL: "false"
        run: |
          cosign sign --yes "${IMAGE_REPO}@${IMAGE_DIGEST}"

      - name: Verify image signature (self-check)
        env:
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          cosign verify \
            "${IMAGE_REPO}@${IMAGE_DIGEST}" \
            --certificate-identity "https://github.com/${GH_REPOSITORY}/.github/workflows/job-sign-verify.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Output immutable image reference
        env:
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          echo "## Final Signing Report" >> "$GITHUB_STEP_SUMMARY"
          echo "- IMAGE_REF=${IMAGE_REPO}@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo "- SIGNER=https://github.com/${GH_REPOSITORY}/.github/workflows/job-sign-verify.yml@refs/heads/main" >> "$GITHUB_STEP_SUMMARY"
          echo "- SIGNATURE_VERIFY=PASS" >> "$GITHUB_STEP_SUMMARY"

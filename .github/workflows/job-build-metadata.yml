# Reusable job: build metadata (lint + smoke test).
# Compiles the FastAPI app, runs a compile-lint surrogate and a route smoke
# test, then uploads the lint/test JSON as artifacts consumed later by the
# VBBI attestation step.
name: job-build-metadata

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  build-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (StepSecurity)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run compile lint surrogate
        run: |
          python -m compileall main.py
          cat > lint-results.json <<'EOF'
          {
            "exit_code": 0,
            "linter": "python-compileall",
            "violation_count": 0
          }
          EOF

      - name: Run application smoke test
        run: |
          python - <<'PY' > test-results.json
          import json
          from main import app
          routes = sorted(route.path for route in app.routes)
          payload = {
              "exit_code": 0,
              "framework": "fastapi",
              "route_count": len(routes),
              "health_present": "/health" in routes and "/healthz" in routes,
          }
          print(json.dumps(payload))
          PY

      - name: Upload lint metadata
        uses: actions/upload-artifact@v4
        with:
          name: vbbi-lint
          path: lint-results.json

      - name: Upload test metadata
        uses: actions/upload-artifact@v4
        with:
          name: vbbi-test
          path: test-results.json

name: ci-cd-demo-app

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  MANIFESTS_REPO: SabinGhost19/vulfastapi-manifests-samples
  MANIFESTS_REF: main
  MANIFESTS_SUBPATH: demo-app
  MANIFESTS_CHECKOUT_PATH: manifests-source

jobs:
  build-metadata:
    runs-on: ubuntu-latest
    outputs:
      lint_artifact: vbbi-lint
      test_artifact: vbbi-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run compile lint surrogate
        run: |
          python -m compileall main.py
          cat > lint-results.json <<'EOF'
          {
            "exit_code": 0,
            "linter": "python-compileall",
            "violation_count": 0
          }
          EOF

      - name: Run application smoke test
        run: |
          python - <<'PY' > test-results.json
          import json
          from main import app
          routes = sorted(route.path for route in app.routes)
          payload = {
              "exit_code": 0,
              "framework": "fastapi",
              "route_count": len(routes),
              "health_present": "/health" in routes and "/healthz" in routes,
          }
          print(json.dumps(payload))
          PY

      - name: Upload lint metadata
        uses: actions/upload-artifact@v4
        with:
          name: vbbi-lint
          path: lint-results.json

      - name: Upload test metadata
        uses: actions/upload-artifact@v4
        with:
          name: vbbi-test
          path: test-results.json

  build-push:
    runs-on: ubuntu-latest
    needs: build-metadata
    outputs:
      image_repo: ${{ steps.imagevars.outputs.image_repo }}
      image_digest: ${{ steps.build-and-push.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image repository name
        id: imagevars
        shell: bash
        run: |
          echo "image_repo=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/demo-vulnerable-fastapi" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.imagevars.outputs.image_repo }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=v1.1.8,enable={{is_default_branch}}

      - name: Build and push image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  scan-image:
    runs-on: ubuntu-latest
    needs: build-push
    outputs:
      artifact_name: vbbi-scan
    steps:
      - name: Run Trivy scan on pushed image digest
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ needs.build-push.outputs.image_repo }}@${{ needs.build-push.outputs.image_digest }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0
          ignore-unfixed: true
          scanners: vuln
          hide-progress: true

      - name: Persist scan metadata
        run: |
          cat > scan-results.json <<EOF
          {
            "exit_code": 0,
            "scanner": "trivy",
            "severity": "HIGH,CRITICAL",
            "image": "${{ needs.build-push.outputs.image_repo }}@${{ needs.build-push.outputs.image_digest }}"
          }
          EOF

      - name: Upload scan metadata
        uses: actions/upload-artifact@v4
        with:
          name: vbbi-scan
          path: scan-results.json

  attestations:
    runs-on: ubuntu-latest
    needs:
      - build-metadata
      - build-push
      - scan-image
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout config repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MANIFESTS_REPO }}
          ref: ${{ env.MANIFESTS_REF }}
          path: ${{ env.MANIFESTS_CHECKOUT_PATH }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Download lint metadata
        uses: actions/download-artifact@v4
        with:
          name: vbbi-lint
          path: /tmp/vbbi

      - name: Download test metadata
        uses: actions/download-artifact@v4
        with:
          name: vbbi-test
          path: /tmp/vbbi

      - name: Download scan metadata
        uses: actions/download-artifact@v4
        with:
          name: vbbi-scan
          path: /tmp/vbbi

      - name: Generate and attest SBOM (spdxjson)
        env:
          IMAGE_REPO: ${{ needs.build-push.outputs.image_repo }}
          IMAGE_DIGEST: ${{ needs.build-push.outputs.image_digest }}
        run: |
          IMAGE_REF="${IMAGE_REPO}@${IMAGE_DIGEST}"
          syft "$IMAGE_REF" -o spdx-json > sbom.spdx.json
          # Defense in depth: empty/malformed SBOM previously caused silent
          # "missing attestation" failures downstream — explicit check
          # so the job fails loudly at the right step.
          if [ ! -s sbom.spdx.json ]; then
            echo "FATAL: syft produced an empty SBOM file" >&2
            exit 1
          fi
          if ! jq -e '.SPDXID' sbom.spdx.json >/dev/null; then
            echo "FATAL: SBOM is not valid SPDX JSON (no SPDXID field)" >&2
            head -c 512 sbom.spdx.json >&2
            exit 1
          fi
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson "$IMAGE_REF"
          # Give Rekor a moment to commit the entry. The verify step that
          # runs ~10s later can race the transparency-log batch otherwise.
          sleep 5

      - name: Attest OpenVEX statements (false-positive justifications)
        if: ${{ hashFiles('vex.json') != '' }}
        run: |
          IMAGE_REF=${{ needs.build-push.outputs.image_repo }}@${{ needs.build-push.outputs.image_digest }}
          # OpenVEX v0.2.0 predicate carries auditor-signed justifications for
          # Trivy false-positives. The operator (vex.py) ingests these to filter
          # CVEs at admission time, avoiding pipeline blocks on unreachable code.
          # cosign does not have a shorthand for VEX (unlike `spdxjson`), so the
          # full OpenVEX predicate-type URI is required.
          cosign attest --yes \
            --predicate vex.json \
            --type "https://openvex.dev/ns/v0.2.0" \
            "$IMAGE_REF"

      - name: Prepare VBBI step specification
        run: |
          IMAGE_REF=${{ needs.build-push.outputs.image_repo }}@${{ needs.build-push.outputs.image_digest }}
          cat > /tmp/vbbi/build-results.json <<EOF
          {
            "exit_code": 0,
            "image_ref": "$IMAGE_REF",
            "digest": "${{ needs.build-push.outputs.image_digest }}"
          }
          EOF
          cat > /tmp/vbbi/step-spec.json <<'EOF'
          [
            {"name": "linting", "file": "/tmp/vbbi/lint-results.json"},
            {"name": "unit-tests", "file": "/tmp/vbbi/test-results.json"},
            {"name": "image-build", "file": "/tmp/vbbi/build-results.json"},
            {"name": "vulnerability-scan", "file": "/tmp/vbbi/scan-results.json"}
          ]
          EOF

      - name: Attach VBBI attestation
        id: vbbi
        uses: SabinGhost19/Voucher-Based-Build-Integrity-Action@1.0
        with:
          image: ${{ needs.build-push.outputs.image_repo }}@${{ needs.build-push.outputs.image_digest }}
          commit-sha: ${{ github.sha }}
          step-spec-path: /tmp/vbbi/step-spec.json
          hmac-key: ${{ secrets.VBBI_HMAC_KEY || 'dev-only-vbbi-key' }}
          slsa-level: "3"

      - name: Attach ZTA policy attestation
        uses: SabinGhost19/policyAttestor-action@main
        with:
          image: ${{ needs.build-push.outputs.image_repo }}@${{ needs.build-push.outputs.image_digest }}
          policy-path: ./security-policy.yaml
          manifest-dir: ./${{ env.MANIFESTS_CHECKOUT_PATH }}/${{ env.MANIFESTS_SUBPATH }}
          attestation-type: https://devsecops.licenta.ro/attestations/custom-zta-policy/v1

      - name: Verify attestations and expected infra hash
        env:
          IMAGE_REPO: ${{ needs.build-push.outputs.image_repo }}
          IMAGE_DIGEST: ${{ needs.build-push.outputs.image_digest }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          IMAGE_REF="${IMAGE_REPO}@${IMAGE_DIGEST}"
          IDENTITY="https://github.com/${GH_REPOSITORY}/.github/workflows/ci-cd.yaml@refs/heads/main"
          MANIFEST_DIR="./${{ env.MANIFESTS_CHECKOUT_PATH }}/${{ env.MANIFESTS_SUBPATH }}"

          # Rekor transparency-log inclusion can lag a few seconds after
          # cosign attest returns. Retry SBOM verify with bounded backoff
          # so a slow Rekor batch doesn't fail the whole pipeline.
          set +e
          for attempt in 1 2 3 4 5; do
            cosign verify-attestation \
              "$IMAGE_REF" \
              --type spdxjson \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              >/tmp/sbom-attestation.jsonl 2>/tmp/sbom-verify.err
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "SBOM verify succeeded on attempt $attempt"
              break
            fi
            echo "SBOM verify attempt $attempt failed (rc=$rc), retrying..." >&2
            cat /tmp/sbom-verify.err >&2 || true
            sleep $((attempt * 5))
          done
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "FATAL: SBOM attestation not verifiable after 5 attempts" >&2
            echo "Attached attestations on image:" >&2
            cosign tree "$IMAGE_REF" >&2 || true
            exit 1
          fi

          cosign verify-attestation \
            "$IMAGE_REF" \
            --type "https://devsecops.licenta.ro/attestations/custom-zta-policy/v1" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            >/tmp/policy-attestation.jsonl

          cosign verify-attestation \
            "$IMAGE_REF" \
            --type "https://devsecops.licenta.ro/VBBI/v1" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            >/tmp/vbbi-attestation.jsonl

          mapfile -t YAML_FILES < <(find "$MANIFEST_DIR" -type f \( -name '*.yaml' -o -name '*.yml' \) | sort)
          if [ ${#YAML_FILES[@]} -eq 0 ]; then
            echo "No YAML files found in manifest directory: $MANIFEST_DIR" >&2
            exit 1
          fi

          ZTA_SPECS_JSON="$(yq ea -o=json '[select(.kind == "ZeroTrustApplication") | .spec]' "${YAML_FILES[@]}")"
          SPEC_COUNT="$(printf '%s' "$ZTA_SPECS_JSON" | jq 'length')"
          if [ "$SPEC_COUNT" -ne 1 ]; then
            echo "Expected exactly one ZeroTrustApplication spec in manifest directory, found: $SPEC_COUNT" >&2
            exit 1
          fi

          CANONICAL_SPEC=$(printf '%s' "$ZTA_SPECS_JSON" | jq -c -S --arg image "$IMAGE_REF" '.[0] | .image = $image')
          LOCAL_HASH=$(printf '%s' "$CANONICAL_SPEC" | sha256sum | awk '{print $1}')
          LOCAL_HASH_NORMALIZED=$(echo "$LOCAL_HASH" | tr '[:upper:]' '[:lower:]' | sed 's/^sha256://')

          mapfile -t ATTESTED_HASHES < <(
            jq -r '.payload' /tmp/policy-attestation.jsonl \
              | while read -r payload; do
                  printf '%s' "$payload" | base64 -d | jq -r '.predicate.expected_infra_hash // empty'
                done \
              | sed '/^$/d' \
              | tr '[:upper:]' '[:lower:]' \
              | sed 's/^sha256://' \
              | sort -u
          )

          if [ ${#ATTESTED_HASHES[@]} -eq 0 ]; then
            echo "No expected_infra_hash values found in policy attestations" >&2
            exit 1
          fi

          MATCH_FOUND="false"
          for h in "${ATTESTED_HASHES[@]}"; do
            if [ "$h" = "$LOCAL_HASH_NORMALIZED" ]; then
              MATCH_FOUND="true"
              break
            fi
          done

          if [ "$MATCH_FOUND" != "true" ]; then
            echo "expected_infra_hash mismatch: none of attested hashes match local hash" >&2
            echo "attested_hashes=${ATTESTED_HASHES[*]}" >&2
            echo "local_hash=$LOCAL_HASH" >&2
            exit 1
          fi

          VBBI_REPOSITORY=$(jq -r '.payload' /tmp/vbbi-attestation.jsonl | head -n1 | base64 -d | jq -r '.predicate.build_context.repository')
          VBBI_ROOT=$(jq -r '.payload' /tmp/vbbi-attestation.jsonl | head -n1 | base64 -d | jq -r '.predicate.merkle_tree.root_hash')
          VBBI_PROVIDER=$(jq -r '.payload' /tmp/vbbi-attestation.jsonl | head -n1 | base64 -d | jq -r '.predicate.hmac_chain.provider')
          VBBI_STEP_COUNT=$(jq -r '.payload' /tmp/vbbi-attestation.jsonl | head -n1 | base64 -d | jq -r '.predicate.hmac_chain.steps | length')
          if [ -z "$VBBI_REPOSITORY" ] || [ -z "$VBBI_ROOT" ] || [ "$VBBI_ROOT" = "null" ]; then
            echo "VBBI attestation is missing repository or merkle root" >&2
            exit 1
          fi

          if [ "$VBBI_PROVIDER" != "shared-secret" ]; then
            echo "Expected VBBI shared-secret provider but found: $VBBI_PROVIDER" >&2
            exit 1
          fi

          if [ "$VBBI_STEP_COUNT" != "4" ]; then
            echo "Expected exactly 4 VBBI steps but found: $VBBI_STEP_COUNT" >&2
            exit 1
          fi

          if [ "$VBBI_ROOT" != "${{ steps.vbbi.outputs.merkle-root }}" ]; then
            echo "VBBI merkle root mismatch between action output and attestation" >&2
            exit 1
          fi

          echo "SBOM and policy attestations verified; expected_infra_hash matched."

          echo "## Attestation Report" >> "$GITHUB_STEP_SUMMARY"
          echo "- IMAGE_REF=$IMAGE_REF" >> "$GITHUB_STEP_SUMMARY"
          echo "- POLICY_ATTESTATION_TYPE=https://devsecops.licenta.ro/attestations/custom-zta-policy/v1" >> "$GITHUB_STEP_SUMMARY"
          echo "- SBOM_ATTESTATION_TYPE=spdxjson" >> "$GITHUB_STEP_SUMMARY"
          echo "- VBBI_ATTESTATION_TYPE=https://devsecops.licenta.ro/VBBI/v1" >> "$GITHUB_STEP_SUMMARY"
          echo "- VBBI_REPOSITORY=$VBBI_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
          echo "- VBBI_PROVIDER=$VBBI_PROVIDER" >> "$GITHUB_STEP_SUMMARY"
          echo "- VBBI_STEP_COUNT=$VBBI_STEP_COUNT" >> "$GITHUB_STEP_SUMMARY"
          echo "- VBBI_MERKLE_ROOT=$VBBI_ROOT" >> "$GITHUB_STEP_SUMMARY"
          echo "- VBBI_ACTION_MERKLE_ROOT=${{ steps.vbbi.outputs.merkle-root }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- MANIFEST_DIR=$MANIFEST_DIR" >> "$GITHUB_STEP_SUMMARY"
          echo "- ATTESTED_INFRA_HASH_COUNT=${#ATTESTED_HASHES[@]}" >> "$GITHUB_STEP_SUMMARY"
          echo "- ATTESTED_INFRA_HASHES=${ATTESTED_HASHES[*]}" >> "$GITHUB_STEP_SUMMARY"
          echo "- COMPUTED_INFRA_HASH=$LOCAL_HASH" >> "$GITHUB_STEP_SUMMARY"
          echo "- RESULT=PASS" >> "$GITHUB_STEP_SUMMARY"

  # Official SLSA v1.0 container provenance (independent of VBBI).
  # VBBI proves the internal step ordering inside our pipeline;
  # SLSA v1.0 proves the workflow itself ran in an isolated GitHub-hosted
  # runner with non-forgeable build metadata signed by Fulcio.
  # Together they form a dual-attestation: one OSS-standard, one custom.
  slsa-provenance:
    needs:
      - build-push
    permissions:
      id-token: write
      packages: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.0.0
    with:
      image: ${{ needs.build-push.outputs.image_repo }}
      digest: ${{ needs.build-push.outputs.image_digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  sign-and-verify:
    runs-on: ubuntu-latest
    needs:
      - build-push
      - attestations
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign image with Cosign keyless
        env:
          COSIGN_EXPERIMENTAL: "false"
        run: |
          cosign sign --yes ${{ needs.build-push.outputs.image_repo }}@${{ needs.build-push.outputs.image_digest }}

      - name: Verify image signature (self-check)
        run: |
          cosign verify \
            ${{ needs.build-push.outputs.image_repo }}@${{ needs.build-push.outputs.image_digest }} \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/ci-cd.yaml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Output immutable image reference
        run: |
          echo "## Final Signing Report" >> "$GITHUB_STEP_SUMMARY"
          echo "- IMAGE_REF=${{ needs.build-push.outputs.image_repo }}@${{ needs.build-push.outputs.image_digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- SIGNER=https://github.com/${{ github.repository }}/.github/workflows/ci-cd.yaml@refs/heads/main" >> "$GITHUB_STEP_SUMMARY"
          echo "- SIGNATURE_VERIFY=PASS" >> "$GITHUB_STEP_SUMMARY"

  # NOTE: GUAC ingestion is intentionally NOT performed from CI/CD.
  # The pipeline is the "producer of evidence" — it attests SBOM and VEX
  # to the OCI registry via cosign. The cluster-side zta-operator is the
  # "consumer and distributor of evidence" — at admission time it pulls
  # those attestations from OCI and ingests them into GUAC asynchronously,
  # so a private/air-gapped GUAC instance never has to be exposed to
  # GitHub Actions. See docs §14.7 (Pull-based Threat Intel).

  # GitOps push-back: after every successful, signed build, bump the image
  # digest in the manifests repo (`vulfastapi-manifests-samples`). The
  # operator's expected_infra_hash is computed at attest time over a
  # canonical spec that embeds the NEW digest, so the ZTA YAML must
  # reference the same digest at apply time — otherwise the operator's
  # manifest-hash check rejects the resource. This job keeps the GitOps
  # repo in lock-step with each release; no manual `sed` step needed.
  bump-manifests-repo:
    runs-on: ubuntu-latest
    needs:
      - build-push
      - attestations
      - sign-and-verify
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout manifests repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MANIFESTS_REPO }}
          ref: ${{ env.MANIFESTS_REF }}
          token: ${{ secrets.MANIFESTS_REPO_TOKEN }}
          path: manifests-repo
          persist-credentials: true

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update ZeroTrustApplication.spec.image with the new digest
        id: bump
        env:
          IMAGE_REPO: ${{ needs.build-push.outputs.image_repo }}
          IMAGE_DIGEST: ${{ needs.build-push.outputs.image_digest }}
        run: |
          set -euo pipefail
          # `export` is mandatory: yq's strenv(...) reads from process
          # environment, NOT from shell-local variables. Without export
          # the substitution silently yields an empty string and the
          # manifest gets written with .spec.image = "" (the previous
          # bug that produced commit ae71674).
          export NEW_IMAGE="${IMAGE_REPO}@${IMAGE_DIGEST}"
          CHANGED=0
          # Walk every YAML file under the demo-app folder; patch only docs
          # whose kind is ZeroTrustApplication and whose .spec.image is the
          # same repo (avoids overwriting unrelated images that share the
          # manifests dir, e.g. sidecars).
          while IFS= read -r -d '' file; do
            # Step 1: does this YAML contain a ZeroTrustApplication at all?
            # If not (it's an SCA, ZTS, raw Deployment...) we skip silently.
            HAS_ZTA=$(yq eval-all 'select(.kind == "ZeroTrustApplication") | .kind' "$file" 2>/dev/null | head -1 || true)
            if [ "$HAS_ZTA" != "ZeroTrustApplication" ]; then
              continue
            fi
            # Step 2: read the current .spec.image. Empty string is a
            # VALID state to detect here — it is the broken aftermath of
            # commit ae71674 (yq strenv writing "" because NEW_IMAGE was
            # not exported). We MUST bump in that case, otherwise the
            # regression heals only after a human edit.
            CURRENT=$(yq eval-all 'select(.kind == "ZeroTrustApplication") | .spec.image' "$file" 2>/dev/null | head -1 || true)
            if [ "$CURRENT" = "$NEW_IMAGE" ]; then
              echo "skip (already at new digest): $file"
              continue
            fi
            # Step 3: same-repo guard. Only enforced when CURRENT actually
            # has an `@sha256:` segment (so CUR_REPO != CURRENT). Empty,
            # null, or tag-only values fall through to bump.
            CUR_REPO="${CURRENT%@*}"
            if [ -n "$CURRENT" ] \
               && [ "$CURRENT" != "null" ] \
               && [ "$CUR_REPO" != "$CURRENT" ] \
               && [ "$CUR_REPO" != "$IMAGE_REPO" ]; then
              echo "skip (different repo $CUR_REPO): $file"
              continue
            fi
            echo "bump: $file (${CURRENT:-<empty>} -> $NEW_IMAGE)"
            yq eval -i \
              '(select(.kind == "ZeroTrustApplication") | .spec.image) = strenv(NEW_IMAGE)' \
              "$file"
            # Defensive verification: re-read .spec.image and refuse to
            # commit an empty value, even if some future yq version
            # silently mis-handles strenv.
            WRITTEN=$(yq eval-all 'select(.kind == "ZeroTrustApplication") | .spec.image' "$file" | head -1)
            if [ -z "$WRITTEN" ] || [ "$WRITTEN" = "null" ] || [ "$WRITTEN" = '""' ]; then
              echo "FATAL: yq wrote an empty image into $file" >&2
              exit 1
            fi
            CHANGED=$((CHANGED + 1))
          done < <(find manifests-repo/${{ env.MANIFESTS_SUBPATH }} -type f \( -name '*.yaml' -o -name '*.yml' \) -print0)

          echo "files_changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "new_image=$NEW_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Commit & push to manifests repo
        if: ${{ steps.bump.outputs.files_changed != '0' }}
        env:
          NEW_IMAGE: ${{ steps.bump.outputs.new_image }}
        run: |
          set -euo pipefail
          cd manifests-repo
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # [skip ci] keeps a future workflow on the manifests repo from
          # firing in a loop if one is ever added there.
          git commit -m "chore(image): bump demo-app to ${NEW_IMAGE} [skip ci]" \
                     -m "Source build: ${{ github.repository }}@${{ github.sha }}"
          git push origin "${{ env.MANIFESTS_REF }}"

      - name: Emit summary
        run: |
          echo "## Manifests Repo Bump" >> "$GITHUB_STEP_SUMMARY"
          echo "- target: ${{ env.MANIFESTS_REPO }}@${{ env.MANIFESTS_REF }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- new image: ${{ steps.bump.outputs.new_image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- files changed: ${{ steps.bump.outputs.files_changed }}" >> "$GITHUB_STEP_SUMMARY"

# Orchestrator for the demo-app supply-chain pipeline.
#
# This file intentionally contains NO step logic — every job lives in its own
# reusable workflow (job-*.yml) and is wired here via needs/with. This keeps the
# DAG readable in one place while each job stays small and independently
# reviewable.
#
# Config single-source: registry / manifests coordinates are passed as literal
# inputs below (the `env` context is not allowed in `jobs.<id>.with`, so we use
# literals). Dynamic values (image repo/digest) flow via needs.*.outputs.*.
#
# Keyless identities (see job-attestations.yml / job-sign-verify.yml): because
# cosign runs inside the reusable workflows, the Fulcio SAN is the job-*.yml
# path. Consumers (zta-operator / cosign verify) must expect:
#   attestations -> .../.github/workflows/job-attestations.yml@refs/heads/main
#   signature    -> .../.github/workflows/job-sign-verify.yml@refs/heads/main
name: ci-cd-demo-app

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-metadata:
    uses: ./.github/workflows/job-build-metadata.yml

  build-push:
    needs: build-metadata
    uses: ./.github/workflows/job-build-push.yml
    with:
      registry: ghcr.io
      image_name: demo-vulnerable-fastapi
    secrets: inherit

  scan-image:
    needs: build-push
    uses: ./.github/workflows/job-scan-image.yml
    with:
      image_repo: ${{ needs.build-push.outputs.image_repo }}
      image_digest: ${{ needs.build-push.outputs.image_digest }}

  attestations:
    needs:
      - build-metadata
      - build-push
      - scan-image
    uses: ./.github/workflows/job-attestations.yml
    with:
      registry: ghcr.io
      image_repo: ${{ needs.build-push.outputs.image_repo }}
      image_digest: ${{ needs.build-push.outputs.image_digest }}
      manifests_repo: SabinGhost19/vulfastapi-manifests-samples
      manifests_ref: main
      manifests_subpath: demo-app
    secrets: inherit

  # Official SLSA v1.0 container provenance (independent of VBBI).
  # VBBI proves the internal step ordering inside our pipeline;
  # SLSA v1.0 proves the workflow itself ran in an isolated GitHub-hosted
  # runner with non-forgeable build metadata signed by Fulcio.
  # Together they form a dual-attestation: one OSS-standard, one custom.
  slsa-provenance:
    needs:
      - build-push
    permissions:
      id-token: write
      packages: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.0.0
    with:
      image: ${{ needs.build-push.outputs.image_repo }}
      digest: ${{ needs.build-push.outputs.image_digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  # NOTE: GUAC ingestion is intentionally NOT performed from CI/CD.
  # The pipeline is the "producer of evidence" — it attests SBOM and VEX
  # to the OCI registry via cosign. The cluster-side zta-operator is the
  # "consumer and distributor of evidence" — at admission time it pulls
  # those attestations from OCI and ingests them into GUAC asynchronously,
  # so a private/air-gapped GUAC instance never has to be exposed to
  # GitHub Actions. See docs §14.7 (Pull-based Threat Intel).

  sign-verify:
    needs:
      - build-push
      - attestations
    uses: ./.github/workflows/job-sign-verify.yml
    with:
      registry: ghcr.io
      image_repo: ${{ needs.build-push.outputs.image_repo }}
      image_digest: ${{ needs.build-push.outputs.image_digest }}
    secrets: inherit

  # GitOps push-back: after every successful, signed build, bump the image
  # digest in the manifests repo (`vulfastapi-manifests-samples`) so the ZTA
  # YAML references the same digest the operator's expected_infra_hash was
  # computed over. Only on push to main.
  bump-manifests:
    needs:
      - build-push
      - attestations
      - sign-verify
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/job-bump-manifests.yml
    with:
      image_repo: ${{ needs.build-push.outputs.image_repo }}
      image_digest: ${{ needs.build-push.outputs.image_digest }}
      manifests_repo: SabinGhost19/vulfastapi-manifests-samples
      manifests_ref: main
      manifests_subpath: demo-app
    secrets: inherit
